  <!-- 冠顶圆珠 -->
  <circle cx="20" cy="29" r="4" fill="#ffe9a3" stroke="#8a5a00" stroke-width="2"/>
  <circle cx="48" cy="21" r="4" fill="#ffe9a3" stroke="#8a5a00" stroke-width="2"/>
  <circle cx="76" cy="29" r="4" fill="#ffe9a3" stroke="#8a5a00" stroke-width="2"/>
  <!-- 藏在冠身里的 MAYDAY 字样 -->
  <text x="48" y="60.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="bold" letter-spacing="1.5" fill="#7a4a00">MAYDAY</text>
</svg>
