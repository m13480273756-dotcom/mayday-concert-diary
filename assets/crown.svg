<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#d99a1f"/>
    </linearGradient>
  </defs>
  <!-- 冠顶的 +（代表五月天和你） -->
  <path d="M48 4v20M38 14h20" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="48" cy="4" r="3" fill="#f7c948"/>
  <!-- 皇冠主体 -->
  <path d="M13 60 L20 30 L33 48 L48 22 L63 48 L76 30 L83 60 Z"
